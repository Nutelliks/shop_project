{% block js %}    
    <script src="{% static 'users/js/api.js' %}"></script> 
    <script src="{% static 'users/js/show_password.js' %}"></script> 
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Собираем данные формы
            const formData = new FormData(e.target);
            const userData = {
                username: formData.get('username'),
                email: formData.get('email'),
                password: formData.get('password1'),
                password2: formData.get('password2'),
                first_name: formData.get('first_name') || '',
                last_name: formData.get('last_name') || ''
            };
            
            // Отправляем запрос
            const response = await api.register(userData);
            const result = await response.json();
            
            const messageDiv = document.getElementById('message');
            
            if (response.ok) {
                messageDiv.style.color = 'green';
                messageDiv.innerHTML = 'Регистрация успешна! Перенаправление на страницу входа...';
                
                // Очищаем форму
                e.target.reset();
                
                // Перенаправляем на страницу входа через 2 секунды
                setTimeout(() => {
                    window.location.href = '/user/login/';
                }, 2000);
            } else {
                messageDiv.style.color = 'red';
                
                // Форматируем ошибки для красивого отображения
                let errorHtml = '<strong>Ошибка регистрации:</strong><ul>';
                for (const [field, errors] of Object.entries(result)) {
                    errorHtml += `<li>${field}: ${Array.isArray(errors) ? errors.join(', ') : errors}</li>`;
                }
                errorHtml += '</ul>';
                messageDiv.innerHTML = errorHtml;
            }
        });
    </script>
{% endblock %}
