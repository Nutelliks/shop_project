                    <form id="loginForm">

{% block js %}    
    <script src="{% static 'users/js/api.js' %}"></script> 
    <script src="{% static 'users/js/show_password.js' %}"></script> 
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('id_username').value;
            const password = document.getElementById('id_password').value;
            
            const response = await api.login({ username, password });
            const result = response.data || {};
            
            const messageDiv = document.getElementById('message');
            
            if (response.ok) {
                messageDiv.style.color = 'green';
                messageDiv.innerHTML = 'Вход выполнен успешно! Перенаправление...';
                console.log('Токены сохранены:', { access: !!api.accessToken, refresh: !!api.refreshToken });
                
                setTimeout(() => {
                    window.location.href = '/';
                }, 1000);
            } else {
                messageDiv.style.color = 'red';
                messageDiv.innerHTML = `Ошибка: ${result.detail || result.message || 'Неверный username или пароль'}`;
                console.error('Login failed:', result);
            }
        });
    </script>
{% endblock %}
